services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: projects
      POSTGRES_PASSWORD: projects
      POSTGRES_DB: project_s
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local SMTP server that catches alert emails. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
